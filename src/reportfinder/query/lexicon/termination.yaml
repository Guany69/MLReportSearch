domain: termination
schema: 1
rules:
  - id: term.people_left
    phrases: ["people who left", "who left", "employees who left", "people leaving", "people leave", "departed", "departures", "separations", "offboarding", "exited", "exits"]
    emits:
      - {canonical: "Termination Date", kind: field, confidence: 0.82}
      - {canonical: "Termination Reason", kind: field, confidence: 0.82}
  - id: term.voluntary_exit
    phrases: ["voluntary exit", "voluntary exits", "voluntary termination", "voluntary separation", "resigned", "resignation", "quit"]
    context: {requires_none: ["involuntary"]}
    emits:
      - {canonical: "Termination Reason", kind: field, confidence: 0.85}
      - {canonical: "Termination Type", kind: field, confidence: 0.82}
  # The involuntary counterpart to term.voluntary_exit. Everyday speech for this
  # end of the catalog's vocabulary is almost entirely colloquial -- the workbook
  # only ever says "Termination", so "fires", "laid off" and "let go" reach the
  # corpus vocabulary with no signal at all and the reranker cannot separate any
  # candidate from any other. Termination Type is emitted highest because it is
  # the field that actually records voluntary versus involuntary.
  - id: term.involuntary_exit
    phrases: ["fires", "fired", "firings", "laid off", "layoff", "layoffs", "let go", "dismissed", "dismissal", "dismissals", "involuntary termination", "involuntary exit", "involuntary separation", "terminated for cause"]
    emits:
      - {canonical: "Termination Type", kind: field, confidence: 0.85}
      - {canonical: "Termination Reason", kind: field, confidence: 0.85}
      - {canonical: "Termination Date", kind: field, confidence: 0.82}
      - {canonical: "Termination Count", kind: field, confidence: 0.80}
  - id: term.turnover_rate
    phrases: ["turnover rate", "attrition rate", "churn rate", "employee turnover", "workforce attrition", "employee churn"]
    emits:
      - {canonical: "Termination Count", kind: field, confidence: 0.85}
      - {canonical: "Average Headcount", kind: field, confidence: 0.85}
      - {canonical: "Turnover Rate", kind: field, confidence: 0.90}
  - id: term.voluntary_turnover
    phrases: ["voluntary turnover", "voluntary attrition"]
    emits:
      - {canonical: "Termination Reason", kind: field, confidence: 0.85}
      - {canonical: "Termination Type", kind: field, confidence: 0.82}
      - {canonical: "Termination Count", kind: field, confidence: 0.84}
      - {canonical: "Average Headcount", kind: field, confidence: 0.84}
      - {canonical: "Turnover Rate", kind: field, confidence: 0.88}
  - id: term.termination_detail
    phrases: ["termination details", "separation details", "exit details"]
    emits:
      - {canonical: "Termination Date", kind: field, confidence: 0.88}
      - {canonical: "Termination Reason", kind: field, confidence: 0.88}
      - {canonical: "Termination Type", kind: field, confidence: 0.86}
      - {canonical: "Termination Count", kind: field, confidence: 0.82}
