[project]
name = "reportfinder"
version = "0.1.0"
description = "Unsupervised dual-space product-of-experts retrieval over Workday-style custom report definitions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "streamlit>=1.38",
    "joblib>=1.4",
    # torch 2.12+ ships only macosx_14_0 arm64 wheels; 2.11 is the newest with a
    # macosx_11_0 wheel and so the newest installable on macOS 13. Relax or drop
    # this bound on macOS 14+ / Linux.
    "torch<2.12",
]

[project.scripts]
reportfinder = "reportfinder.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reportfinder"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
