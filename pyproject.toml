[project]
name = "reportfinder"
version = "0.2.0"
description = "Multi-channel retrieval, structured ranking, and answerability for Workday-style reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    # Imported directly by the SPLADE sparse encoder (AutoModelForMaskedLM), not
    # just transitively via sentence-transformers.
    "transformers>=4.40",
    "safetensors>=0.4",
    "streamlit>=1.38",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "pyarrow>=16,<24",
    "lightgbm>=4.3,<5",
    # torch 2.12+ ships only macosx_14_0 arm64 wheels; 2.11 is the newest with a
    # macosx_11_0 wheel and so the newest installable on macOS 13. Relax or drop
    # this bound on macOS 14+ / Linux.
    "torch<2.12",
]

[project.scripts]
reportfinder = "reportfinder.__main__:main"
reportfinder-data = "reportfinder.cli.data:main"
reportfinder-features = "reportfinder.cli.features:main"
reportfinder-train = "reportfinder.cli.train:main"
reportfinder-eval = "reportfinder.cli.eval:main"
reportfinder-smoke = "reportfinder.cli.smoke:main"
reportfinder-bundle = "reportfinder.cli.bundle:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: loads real model checkpoints; requires RF_INTEGRATION=1",
]

[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = [".bundle", ".cache", "artifacts", "data"]

[tool.ruff.lint]
# Chosen to catch *defects*, not to impose a format on code that already made
# different choices. Reformatting the existing modules would be a large unrelated
# change with real review cost and no correctness benefit.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # Line length and compound statements. `relevance/`, `evaluation/` and
    # `cli/data.py` are written in a deliberately dense style; enforcing these
    # would rewrite hundreds of lines nobody asked to have rewritten.
    "E501", "E701", "E702",
    # `typing.Sequence`/`Protocol` are imported deliberately; the project supports
    # 3.11, where some of UP035's preferred spellings are not available.
    "UP035",
    # `class X(str, Enum)` rather than StrEnum. The answerability enum relies on
    # value aliasing (HIGH_CONFIDENCE *is* ANSWERABLE) that several call sites and
    # tests depend on; converting it is a behaviour change, not a modernization.
    "UP042",
    # A ternary is not always clearer than the if/else it replaces.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Streamlit scripts execute top to bottom; imports cannot all precede code.
"app.py" = ["E402"]
# (B905 is now enforced everywhere. The seven previously-exempted zips were all
# same-length-by-construction on inspection, so the exemption was protecting
# nothing; `strict=True` was added to each instead.)
# Guarded imports after `pytest.importorskip`, and deliberate no-op expressions
# used to assert that a lazy property constructs without raising.
"tests/*" = ["E402", "B018"]

[tool.mypy]
# Scoped, but no longer only to the new packages: `evaluation`, `query` and
# `relevance` were measured at 14 errors total, so excluding them was overstating
# the cost. What remains outside is `ingest`, `cli`, `ranking`, `confidence` and
# the top-level modules, which lean heavily on untyped pandas and are a genuinely
# separate piece of work. Loosening the settings until everything passed would be
# worse than an honest boundary.
files = [
    "src/reportfinder/api",
    "src/reportfinder/auth",
    "src/reportfinder/corpus",
    "src/reportfinder/evaluation",
    "src/reportfinder/generators",
    "src/reportfinder/index",
    "src/reportfinder/pipeline",
    "src/reportfinder/query",
    "src/reportfinder/relevance",
    "src/reportfinder/training",
]
# Deliberately not pinned to the 3.11 floor in `requires-python`: the installed
# numpy stubs use `type` statements and fail to parse under a 3.11 target. mypy
# therefore checks against the interpreter it runs on.
ignore_missing_imports = true
follow_imports = "silent"
# Not `strict`. These modules are typed at their boundaries, not exhaustively.
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[tool.hatch.build.targets.wheel]
packages = ["src/reportfinder"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "onnxruntime>=1.20,<1.23",
    "onnxscript>=0.1",  # torch.onnx.export backend
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
# The HTTP service. Kept optional so the CLI, the Streamlit app and the test suite
# do not pull a web framework they never import.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",  # fastapi.testclient
]
# An alternative cross-encoder backend. Optional because the torch path must keep
# working without it, and because the version bound is host-specific: 1.23+ ships
# only macosx_14_0 arm64 wheels, the same wall that pins torch<2.12 here.
onnx = [
    "onnxruntime>=1.20,<1.23",
    "onnxscript>=0.1",  # torch.onnx.export backend
]
