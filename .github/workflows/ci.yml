name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a new push cancels the previous run rather than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Unit tests must never download a checkpoint. `requires_integration` in
  # tests/conftest.py skips everything that loads real weights unless this is set,
  # and a job that quietly starts fetching 400 MB of models is a job that will
  # eventually fail for reasons unrelated to the change under review.
  RF_INTEGRATION: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync from the lockfile
        # `--locked` fails rather than silently resolving: CI must build the
        # environment the lockfile describes, not a newer one that happens to work.
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check src tests scripts app.py demo.py calibrate.py

      - name: Type-check
        run: uv run mypy

      - name: Test
        # Data-blocked tests skip with an explicit reason; `-ra` prints them so a
        # growing skip count is visible rather than being mistaken for coverage.
        run: uv run pytest tests/ -q -ra

      - name: Assert no checkpoint was downloaded
        # A test that quietly reached the network would invalidate the offline
        # guarantee above without failing anything.
        run: |
          if [ -d "$HOME/.cache/huggingface/hub" ]; then
            echo "::error::a test populated the HF cache; unit tests must not download models"
            ls -la "$HOME/.cache/huggingface/hub"
            exit 1
          fi
          echo "no HF cache created"
